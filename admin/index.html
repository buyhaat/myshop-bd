<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MyShop BD Admin</title><style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#222}.top{background:#111;color:#fff;padding:18px 24px;font-size:22px;font-weight:700}.wrap{padding:24px;max-width:1000px;margin:auto}.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 2px 12px #0001}button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff}input{padding:10px;width:100%;box-sizing:border-box;margin:6px 0 12px}</style></head><body><div class="top"><b>M</b> MyShop BD — Admin</div><div class="wrap"><div class="card"><h2>Dashboard</h2><p>Backend API: <span id="status">checking…</span></p></div><div class="card"><h2>Add product</h2><input id="name" placeholder="Product name"><input id="price" type="number" placeholder="Price"><input id="stock" type="number" placeholder="Stock"><button onclick="addProduct()">Add Product</button></div><div class="card"><h2>Products</h2><div id="products">Loading…</div></div></div><script>const API='http://localhost:5000'; async function load(){let r=await fetch(API+'/api/health');document.querySelector('#status').textContent=(await r.json()).brand+' API online';let p=await (await fetch(API+'/api/products')).json();document.querySelector('#products').innerHTML=p.data.map(x=>`<p><b>${x.name}</b> — ৳${x.price} — stock ${x.stock}</p>`).join('')||'No products yet.'} async function addProduct(){await fetch(API+'/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value,price:Number(document.querySelector('#price').value||0),stock:Number(document.querySelector('#stock').value||0)})});load()}load().catch(()=>document.querySelector('#status').textContent='API offline')}</script></body></html>
